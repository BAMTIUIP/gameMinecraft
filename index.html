<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080b0a" />
    <meta
      name="description"
      content="ORE RUSH — a first-person voxel mining sprint. Break blocks, chase ore veins, beat the clock."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>ORE RUSH · Voxel Mining Sprint</title>
    <!-- Yandex Games SDK: https://yandex.ru/dev/games/doc/ru/sdk/sdk-about#connect
         Relative path: the build is uploaded to Yandex as an archive. Keep it a plain synchronous
         script tag ahead of the game code — window.YaGames must exist before YaGames.init() runs.
         Outside Yandex the file is simply absent and the game runs without the SDK.
         (vite-ignore only tells Vite not to try bundling it; the attribute is stripped from the build.) -->
    <script src="/sdk.js" vite-ignore></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
